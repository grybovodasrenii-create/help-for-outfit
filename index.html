<!DOCTYPE html>
<html lang="ru">
<!-- ВСТАВЬ ЭТО В <head> -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    touch-action: manipulation;
  }

  body {
    min-height: 100svh; /* лучше для iPhone */
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
    font-family: Arial, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 650px;
    background: rgba(30, 41, 59, 0.96); /* вместо blur */
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: white;
  }

  input,
  select,
  button {
    width: 100%;
    min-height: 52px;
    padding: 14px;
    border-radius: 14px;
    border: none;
    outline: none;
    font-size: 16px; /* критично: иначе iPhone zoom + баги */
    pointer-events: auto;
    position: relative;
    z-index: 10;
  }

  input,
  select {
    background: rgba(255,255,255,0.14);
    color: white;
    -webkit-appearance: none;
    appearance: none;
  }

  input::placeholder {
    color: #cbd5e1;
  }

  select option {
    color: black;
    background: white;
  }

  button {
    margin-top: 16px;
    background: linear-gradient(90deg, #38bdf8, #6366f1);
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .full {
    grid-column: span 2;
  }

  @media (max-width: 768px) {
    .grid {
      grid-template-columns: 1fr;
    }

    .full {
      grid-column: span 1;
    }

    body {
      align-items: flex-start;
      padding-top: 30px;
    }
  }
</style>

<script>
  // iPhone Safari фикс фокуса
  document.addEventListener("touchstart", function(){}, true);

  window.addEventListener("load", () => {
    const fields = document.querySelectorAll("input, select");

    fields.forEach(field => {
      field.removeAttribute("readonly");

      field.addEventListener("touchend", () => {
        field.focus();
      });
    });
  });
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StyleFit — Подбор одежды</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
  padding: 15px;
  color: white;
}

.card {
  width: 100%;
  max-width: 650px;
  background: rgba(30, 41, 59, 0.95);
  border-radius: 28px;
  padding: 25px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

input, select, button {
  font-size: 16px; /* важно для iPhone */
  -webkit-appearance: none;
  appearance: none;
}

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .full {
      grid-column: span 2;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #e2e8f0;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 14px;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: #cbd5e1;
    }

    option {
      color: black;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(99,102,241,0.4);
    }

    .result {
      margin-top: 28px;
      padding: 22px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .result h2 {
      margin-bottom: 15px;
      color: #38bdf8;
      font-size: 24px;
    }

    .result p {
      margin: 10px 0;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .highlight {
      color: #f8fafc;
      font-weight: 700;
    }

    @media(max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: span 1;
      }

      .card {
        padding: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">StyleFit</div>
    <div class="subtitle">Умный подбор одежды по талии, росту и стилю</div>

    <div class="grid">
      <div class="full">
        <label>Пол</label>
        <select id="gender">
          <option value="male">Мужчина</option>
          <option value="female">Женщина</option>
        </select>
      </div>

      <div>
        <label>Талия (см)</label>
        <input type="number" id="waist" placeholder="Например: 82">
      </div>

      <div>
        <label>Рост (см)</label>
        <input type="number" id="height" placeholder="Например: 178">
      </div>

      <div class="full">
        <button onclick="calculate()">Подобрать стиль</button>
      </div>
    </div>

    <div class="result" id="result">
      <h2>Ваш стиль:</h2>
      <p id="size"></p>
      <p id="fit"></p>
      <p id="style"></p>
    </div>
  </div>

  <script>
    function getSize(gender, waist) {
      if (gender === "male") {
        if (waist <= 70) return "XS (EU 42)";
        if (waist <= 76) return "S (EU 44-46)";
        if (waist <= 84) return "M (EU 48)";
        if (waist <= 92) return "L (EU 50)";
        if (waist <= 100) return "XL (EU 52)";
        return "XXL (EU 54+)";
      } else {
        if (waist <= 60) return "XS (EU 34)";
        if (waist <= 68) return "S (EU 36)";
        if (waist <= 76) return "M (EU 38)";
        if (waist <= 84) return "L (EU 40)";
        if (waist <= 92) return "XL (EU 42)";
        return "XXL (EU 44+)";
      }
    }

    function getHeightFit(height) {
      if (height < 160) {
        return "Petite / укороченные модели.";
      } else if (height <= 180) {
        return "Regular Fit / стандартная длина.";
      } else {
        return "Tall / удлинённые модели.";
      }
    }

    function getStyle(waist) {
      if (waist < 70) {
        return "Slim-fit, зауженные джинсы, приталенные рубашки.";
      } else if (waist < 90) {
        return "Regular-fit, straight jeans, smart casual.";
      } else {
        return "Relaxed-fit, stretch ткани, свободный крой.";
      }
    }

    function calculate() {
      const gender = document.getElementById("gender").value;
      const waist = parseFloat(document.getElementById("waist").value);
      const height = parseFloat(document.getElementById("height").value);

      if (!waist || !height || waist <= 0 || height <= 0) {
        alert("Введите корректные параметры.");
        return;
      }

      const size = getSize(gender, waist);
      const fit = getHeightFit(height);
      const style = getStyle(waist);

      document.getElementById("size").innerHTML = "Размер: <span class='highlight'>" + size + "</span>";
      document.getElementById("fit").innerHTML = "Посадка по росту: <span class='highlight'>" + fit + "</span>";
      document.getElementById("style").innerHTML = "Рекомендации: <span class='highlight'>" + style + "</span>";

      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
